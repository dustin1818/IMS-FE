<main class="page">
  <header class="page-heading"><h1>Help</h1></header>
  <section class="surface help-layout">
    <div class="contact-intro">
      <div><h2>Contact us</h2><p>Tell us what you need help with. Your message will open in your email app.</p>
        <a class="text-action" href="mailto:ims@gmail.com"><mat-icon>mail_outline</mat-icon>ims@gmail.com</a></div>
      <img src="assets/images/123123.svg" alt="">
    </div>
    <form #contactForm="ngForm" (ngSubmit)="openEmail()">
      <div class="fields">
        <label class="field full-field">Name<input type="text" name="name" autocomplete="name" [(ngModel)]="name" required></label>
        <label class="field full-field">Email address<input type="email" name="email" autocomplete="email" [(ngModel)]="email" email></label>
        <label class="field full-field">Message<textarea name="message" rows="5" [(ngModel)]="message" required></textarea></label>
      </div>
      <div class="form-actions"><button type="submit" class="action" [disabled]="contactForm.invalid">Compose email <mat-icon>arrow_forward</mat-icon></button></div>
    </form>
  </section>
</main>

<main class="page record-page">
  <a class="text-action back-link" routerLink="/user/mainbar/employee"><mat-icon>arrow_back</mat-icon>Employees</a>
  <header class="page-heading"><h1>{{ title }}</h1></header>
  <div class="surface record-layout">
    <figure class="record-art grid-art"><img src="assets/images/IMS-Employee (1).png" alt=""></figure>
    <form [formGroup]="employeeForm" (ngSubmit)="addEmployee()">
      <h2>Employee details</h2>
      <div class="fields">
          <label class="field">Employee number<input formControlName="employee_no" type="tel" maxlength="3" required></label>
          <label class="field">Full name<input formControlName="name" type="text" required></label>
          <label class="field">Role<input formControlName="role" type="text" required></label>
          <label class="field">Department
            <select formControlName="department" required>
              <option value="" disabled>Select a department</option>
              <option *ngFor="let option of departmentOptions" [ngValue]="option">{{ option }}</option>
            </select>
          </label>
      </div>
      <div class="form-actions">
        <button type="button" class="action secondary" (click)="return()">Cancel</button>
        <button type="submit" class="action" [disabled]="employeeForm.invalid">Save employee</button>
      </div>
    </form>
  </div>
</main>

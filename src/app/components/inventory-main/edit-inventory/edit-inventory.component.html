<main class="page record-page">
  <a class="text-action back-link" routerLink="/user/mainbar/inventory"><mat-icon>arrow_back</mat-icon>Inventory</a>
  <header class="page-heading"><h1>Edit sample product</h1></header>
  <div class="surface record-layout">
    <figure class="record-art grid-art"><img src="assets/images/IMS -BOX.png" alt=""></figure>
    <form [formGroup]="productForm" (ngSubmit)="submit()">
      <h2>Product details</h2>
      <div class="fields">
          <label class="field">Product name<input formControlName="product_name" type="text" required></label>
          <label class="field">Product type
            <select formControlName="product_type" required>
              <option value="" disabled>Select a type</option>
              <option *ngFor="let option of productOptions" [ngValue]="option">{{ option }}</option>
            </select>
          </label>
          <label class="field">Quantity<input formControlName="quantity" type="number" min="0" required></label>
          <label class="field">Price ($)<input formControlName="price" type="number" step="0.01" min="0" required></label>
      </div>
      <div class="form-actions">
        <button type="button" class="action secondary" (click)="return()">Cancel</button>
        <button type="submit" class="action" [disabled]="productForm.invalid">Save changes</button>
      </div>
    </form>
  </div>
</main>

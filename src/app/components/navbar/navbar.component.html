<mat-sidenav-container class="shell">
  <mat-sidenav #sidenav id="workspace-navigation" [mode]="(mobile$ | async) ? 'over' : 'side'"
    [opened]="!(mobile$ | async)" class="sidebar">
    <div class="rail">
      <a class="brand" routerLink="dashboard" (click)="sidenav.mode === 'over' && sidenav.close()" aria-label="IMS dashboard">
        <img src="assets/images/IMS.svg" alt="">IMS
      </a>
      <nav aria-label="Workspace navigation">
        <div class="nav-group">
          <a *ngFor="let item of sections" [routerLink]="item.path" routerLinkActive="current" #active="routerLinkActive"
            [attr.aria-current]="active.isActive ? 'page' : null" (click)="sidenav.mode === 'over' && sidenav.close()">
            <mat-icon>{{ item.icon }}</mat-icon>{{ item.label }}
          </a>
        </div>
        <div class="nav-group">
          <a *ngFor="let item of accountLinks" [routerLink]="item.path" routerLinkActive="current" #active="routerLinkActive"
            [attr.aria-current]="active.isActive ? 'page' : null" (click)="sidenav.mode === 'over' && sidenav.close()">
            <mat-icon>{{ item.icon }}</mat-icon>{{ item.label }}
          </a>
        </div>
      </nav>
      <div class="rail-footer">
        <button type="button" (click)="signOut('/welcome')" title="Sign out and return home"><mat-icon>home</mat-icon>Home</button>
        <button type="button" (click)="signOut('/signin')"><mat-icon>exit_to_app</mat-icon>Sign out</button>
      </div>
    </div>
  </mat-sidenav>
  <mat-sidenav-content #content>
    <header class="workspace-bar">
      <div>
        <button *ngIf="mobile$ | async" class="icon-action" aria-label="Open navigation" aria-controls="workspace-navigation"
          [attr.aria-expanded]="sidenav.opened" (click)="sidenav.toggle()"><mat-icon>menu</mat-icon></button>
        <span>Inventory workspace</span>
      </div>
      <a routerLink="profile" class="account" aria-label="View your profile" (click)="sidenav.mode === 'over' && sidenav.close()">
        <img src="assets/images/employee-avatar.webp" width="37" height="37" decoding="async" alt="">
        <span>{{ userProfile['username'] || 'Profile' }}<small *ngIf="userProfile['position']">{{ userProfile['position'] }}</small></span>
      </a>
    </header>
    <router-outlet (activate)="content.scrollTo({top: 0})"></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>

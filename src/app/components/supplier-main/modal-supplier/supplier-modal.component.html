<main class="page record-page">
  <a class="text-action back-link" routerLink="/user/mainbar/supplier-list"><mat-icon>arrow_back</mat-icon>Suppliers</a>
  <header class="page-heading"><h1>{{ title }}</h1></header>
  <div class="surface record-layout">
    <figure class="record-art grid-art"><img src="assets/images/1.svg" alt=""></figure>
    <form [formGroup]="supplierForm" (ngSubmit)="addSupplier()">
      <h2>Supplier details</h2>
      <div class="fields">
          <label class="field">Supplier number<input formControlName="supplier_no" type="tel" maxlength="3" required></label>
          <label class="field">Supplier name<input formControlName="name" type="text" required></label>
          <label class="field">Phone number<input formControlName="phone_no" type="tel" maxlength="11" required></label>
          <label class="field">Location<input formControlName="location" type="text" required></label>
      </div>
      <div class="form-actions">
        <button type="button" class="action secondary" (click)="return()">Cancel</button>
        <button type="submit" class="action" [disabled]="supplierForm.invalid">Save supplier</button>
      </div>
    </form>
  </div>
</main>

<app-public-header page="signin"></app-public-header>
<main class="auth-layout">
  <aside class="auth-visual">
    <h2>Inventory Management System</h2>
    <img src="assets/images/welcomepage.svg" alt="">
  </aside>
  <section class="auth-panel">
    <h1>Sign in</h1>
    <p *ngIf="message" [ngClass]="messageClass" role="status">{{ message }}</p>
    <form [formGroup]="form" (ngSubmit)="onLoginSubmit()">
      <div class="fields">
        <label class="field full-field">Email address
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" required>
          <span class="field-error" *ngIf="form.controls.email.invalid && form.controls.email.touched">Enter a valid email address.</span>
        </label>
        <label class="field full-field">Password
          <input type="password" formControlName="password" autocomplete="current-password" required>
          <span class="field-error" *ngIf="form.controls.password.invalid && form.controls.password.touched">Password is required.</span>
        </label>
      </div>
      <button class="action" type="submit" [disabled]="form.invalid || submitting">{{ submitting ? 'Signing in…' : 'Sign in' }} <mat-icon>arrow_forward</mat-icon></button>
    </form>
    <p class="switch">New to IMS? <a routerLink="/signup">Create an account</a></p>
  </section>
</main>

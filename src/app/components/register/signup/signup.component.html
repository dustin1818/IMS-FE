<app-public-header page="signup"></app-public-header>
<main class="auth-layout">
  <aside class="auth-visual">
    <h2>Inventory Management System</h2>
    <img src="assets/images/welcomepage.svg" alt="">
  </aside>
  <section class="auth-panel">
    <h1>Create an account</h1>
    <p *ngIf="message" [ngClass]="messageClass" role="status">{{ message }}</p>
    <form [formGroup]="registerForm" (ngSubmit)="onRegisterSubmit()">
      <div class="fields">
        <label class="field">Username
          <input type="text" formControlName="username" autocomplete="username" required>
          <span class="field-error" *ngIf="registerForm.controls.username.invalid && registerForm.controls.username.touched">Username is required.</span>
        </label>
        <label class="field">Profession
          <input type="text" formControlName="position" autocomplete="organization-title" required>
          <span class="field-error" *ngIf="registerForm.controls.position.invalid && registerForm.controls.position.touched">Profession is required.</span>
        </label>
        <label class="field full-field">Email address
          <input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" required>
          <span class="field-error" *ngIf="registerForm.controls.email.invalid && registerForm.controls.email.touched">Enter a valid email address.</span>
        </label>
        <label class="field">Address
          <input type="text" formControlName="location" autocomplete="street-address" required>
          <span class="field-error" *ngIf="registerForm.controls.location.invalid && registerForm.controls.location.touched">Address is required.</span>
        </label>
        <label class="field">Phone number
          <input type="tel" formControlName="phoneNo" autocomplete="tel" inputmode="numeric" pattern="[0-9]*" maxlength="11" required>
          <span class="field-error" *ngIf="registerForm.controls.phoneNo.invalid && registerForm.controls.phoneNo.touched">Enter up to 11 digits.</span>
        </label>
        <label class="field full-field">Password
          <input type="password" formControlName="password" autocomplete="new-password" required>
          <span class="hint">Use 8–30 characters with uppercase and lowercase letters, a number, and a symbol such as # or !.</span>
          <span class="field-error" *ngIf="registerForm.controls.password.invalid && registerForm.controls.password.touched">Check the password requirements.</span>
        </label>
      </div>
      <button class="action" type="submit" [disabled]="registerForm.invalid || submitting">{{ submitting ? 'Registering…' : 'Register' }} <mat-icon>arrow_forward</mat-icon></button>
    </form>
    <p class="switch">Already have an account? <a routerLink="/signin">Sign in</a></p>
  </section>
</main>
